[package]
name = "foreseer-desktop"
version = "0.2.0"
edition = "2024"
license = "GPL-2.0-only"
publish = false
description = "Native Foreseer shell using Jellium external-frontend playback"
repository = "https://github.com/selmant/foreseer-desktop"
readme = "README.md"

[dependencies]
jfn-rust = { path = "../jellium-desktop/src/jfn_rust", features = ["external-frontend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.10"
directories = "6"
url = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = "0.3"
