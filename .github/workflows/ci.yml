name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CEF_PATH: ${{ github.workspace }}/jellium-desktop-host-ext/.cache/cef

jobs:
  linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: foreseer-desktop

    steps:
      - name: Checkout Foreseer Desktop
        uses: actions/checkout@v4
        with:
          path: foreseer-desktop

      - name: Read Jellium pin
        id: pin
        run: echo "rev=$(tr -d '[:space:]' < jellium.rev)" >> "$GITHUB_OUTPUT"

      - name: Checkout Jellium (pinned)
        uses: actions/checkout@v4
        with:
          repository: selmant/jellium-desktop
          ref: ${{ steps.pin.outputs.rev }}
          path: jellium-desktop-host-ext
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libasound2-dev \
            libclang-dev \
            libmpv-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            ninja-build \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: foreseer-desktop -> target

      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: jellium-desktop-host-ext/.cache/cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jellium-desktop-host-ext/src/Cargo.lock') }}

      - name: Fetch CEF
        working-directory: jellium-desktop-host-ext
        run: cargo xtask fetch-cef

      - name: Boundary audit
        env:
          JELLIUM_DIR: ${{ github.workspace }}/jellium-desktop-host-ext
        run: ./scripts/boundary-audit.sh

      - name: Protocol v2 harness
        run: node scripts/protocol-v2-harness.mjs

      # Format only this crate — path-dep Jellium is pinned and linted upstream.
      - name: Format
        run: cargo fmt -- --check

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
